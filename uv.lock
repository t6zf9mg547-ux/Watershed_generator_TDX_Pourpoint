version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "boto3" },
    { name = "fiona" },
    { name = "geopandas" },
    { name = "numpy" },
    { name = "pandas" },
    { name = "pourpoint" },
    { name = "pyproj" },
    { name = "shapely" },
]

[package.metadata]
requires-dist = [
    { name = "boto3", specifier = ">=1.43.108" },
    { name = "fiona", specifier = ">=1.10.1" },
    { name = "geopandas", specifier = ">=1.0" },
    { name = "numpy", specifier = ">=2.0" },
    { name = "pandas", specifier = ">=2.2" },
    { name = "pourpoint", specifier = ">=0.4.0" },
    { name = "pyproj", specifier = ">=3.6" },
    { name = "shapely", specifier = ">=2.0" },
]
